<ion-header mode="ios">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="register-page">
  <div class="register-container safe-area-bottom" *ngIf="showContent">
    
    <!-- Header -->
    <div class="register-header" @fadeInUp>
      <div class="icon-wrapper">
        <ion-icon name="briefcase-outline"></ion-icon>
      </div>
      <h1 class="register-title">Client Account</h1>
      <p class="register-subtitle">Create your client account to start hiring</p>
    </div>

    <!-- Registration Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="register-form" @fadeInUp>
      
      <div class="form-group">
        <app-input-field
          label="Family Name"
          type="text"
          placeholder="John Doe"
          icon="person-outline"
          [formControlRef]="fullNameControl"
          [required]="true"
          formControlName="fullName">
        </app-input-field>
      </div>
      <div class="form-group">
        <app-input-field
          label="Name"
          type="text"
          placeholder="John Doe"
          icon="person-outline"
          [formControlRef]="fullNameControl"
          [required]="true"
          formControlName="fullName">
        </app-input-field>
      </div>

      <div class="form-group">
        <app-input-field
          label="Email Address"
          type="email"
          placeholder="john@example.com"
          icon="mail-outline"
          [formControlRef]="emailControl"
          [required]="true"
          formControlName="email">
        </app-input-field>
      </div>

      <div class="form-group">
        <app-input-field
          label="Phone Number"
          type="tel"
          placeholder="+1 234 567 8900"
          icon="call-outline"
          [formControlRef]="phoneControl"
          [required]="true"
          hintText="Include country code"
          formControlName="phone">
        </app-input-field>
      </div>

      <div class="form-group">
        <app-input-field
          label="Location"
          type="text"
          placeholder="City, Country"
          icon="location-outline"
          [formControlRef]="locationControl"
          [required]="true"
          formControlName="location">
        </app-input-field>
      </div>
      

      <div class="form-group">
        <app-input-field
          label="Company Name"
          type="text"
          placeholder="Your company (optional)"
          icon="business-outline"
          [formControlRef]="companyNameControl"
          hintText="Optional - helps freelancers know more about you"
          formControlName="companyName">
        </app-input-field>
      </div>

      <div class="form-group">
        <app-input-field
          label="Password"
          type="password"
          placeholder="Create a strong password"
          icon="lock-closed-outline"
          [formControlRef]="passwordControl"
          [required]="true"
          formControlName="password">
        </app-input-field>
        
        <!-- Password Strength Indicator -->
        <div class="password-strength" *ngIf="passwordControl?.value">
          <div class="password-strength__label">Password Strength:</div>
          <div class="password-strength__bars">
            <div class="password-strength__bar" 
                 [class.active]="getPasswordStrength() === 'weak' || getPasswordStrength() === 'medium' || getPasswordStrength() === 'strong'"
                 [class.weak]="getPasswordStrength() === 'weak'">
            </div>
            <div class="password-strength__bar" 
                 [class.active]="getPasswordStrength() === 'medium' || getPasswordStrength() === 'strong'"
                 [class.medium]="getPasswordStrength() === 'medium'">
            </div>
            <div class="password-strength__bar" 
                 [class.active]="getPasswordStrength() === 'strong'"
                 [class.strong]="getPasswordStrength() === 'strong'">
            </div>
          </div>
          <div class="password-strength__text" 
               [class.weak]="getPasswordStrength() === 'weak'"
               [class.medium]="getPasswordStrength() === 'medium'"
               [class.strong]="getPasswordStrength() === 'strong'">
            {{ getPasswordStrength() | titlecase }}
          </div>
        </div>
      </div>

      <div class="form-group">
        <app-input-field
          label="Confirm Password"
          type="password"
          placeholder="Re-enter your password"
          icon="lock-closed-outline"
          [formControlRef]="confirmPasswordControl"
          [required]="true"
          formControlName="confirmPassword">
        </app-input-field>
        
        <div class="form-error" *ngIf="registerForm.hasError('passwordMismatch') && confirmPasswordControl?.touched">
          Passwords do not match
        </div>
      </div>

      <div class="form-actions">
        <app-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading">
          Create Client Account
        </app-button>
      </div>
    </form>

    <!-- Footer -->
    <div class="register-footer" @fadeInUp>
      <p class="footer-text">
        Already have an account? 
        <a class="link" (click)="navigateToLogin()">Sign in</a>
      </p>
    </div>
  </div>
</ion-content>
