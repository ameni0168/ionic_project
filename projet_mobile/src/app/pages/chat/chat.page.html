<ion-header>
  <ion-toolbar>
    <ion-title>Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let msg of messages">
      <ion-label>
        <strong>{{ msg.senderId }}</strong><br>
        {{ msg.content }}
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>

<ion-footer>
  <ion-item>
    <ion-input [(ngModel)]="newMessage" placeholder="Message..."></ion-input>
    <ion-button (click)="sendMessage()">Send</ion-button>
  </ion-item>
</ion-footer>
