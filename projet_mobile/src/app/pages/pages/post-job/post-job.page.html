<ion-header mode="ios">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Post a Job</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="post-job-page">
  <div class="post-job-container safe-area-bottom" *ngIf="showContent">

    <!-- Header -->
    <div class="post-job-header">
      <div class="icon-wrapper">
        <ion-icon name="briefcase-outline"></ion-icon>
      </div>
      <h1 class="post-job-title">Create a Job Offer</h1>
      <p class="post-job-subtitle">
        Describe your project and find the perfect freelancer
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="jobForm" (ngSubmit)="onSubmit()" class="post-job-form">

      <!-- Job Title -->
      <div class="form-group">
        <app-input-field
          label="Job Title"
          type="text"
          placeholder="Build a mobile app"
          icon="briefcase-outline"
          [formControlRef]="titleControl"
          [required]="true"
          formControlName="title">
        </app-input-field>
      </div>

      <!-- Description -->
      <div class="form-group">
        <app-input-field
          label="Project Description"
          type="textarea"
          placeholder="Describe your project in detail..."
          icon="document-text-outline"
          [formControlRef]="descriptionControl"
          [required]="true"
          formControlName="description">
        </app-input-field>
      </div>

      <!-- Category -->
      <div class="form-group">
        <div class="select-wrapper">
          <ion-icon name="layers-outline" class="select-icon"></ion-icon>
          <ion-select
            formControlName="category"
            placeholder="Select a category"
            interface="action-sheet"
            class="category-select">
            <ion-select-option value="Development">💻 Development</ion-select-option>
            <ion-select-option value="Design">🎨 Design</ion-select-option>
            <ion-select-option value="Marketing">📣 Marketing</ion-select-option>
            <ion-select-option value="Writing">✍️ Writing</ion-select-option>
            <ion-select-option value="Video">🎬 Video</ion-select-option>
            <ion-select-option value="Finance">💰 Finance</ion-select-option>
            <ion-select-option value="Data">📊 Data</ion-select-option>
            <ion-select-option value="Other">📦 Other</ion-select-option>
          </ion-select>
        </div>
      </div>

      <!-- Budget -->
      <div class="form-group">
        <app-input-field
          label="Budget ($)"
          type="number"
          placeholder="1000"
          icon="cash-outline"
          [formControlRef]="budgetControl"
          [required]="true"
          formControlName="budget">
        </app-input-field>
      </div>

      <!-- Experience -->
      <div class="form-group">
        <app-input-field
          label="Experience Level"
          type="text"
          placeholder="Beginner / Intermediate / Expert"
          icon="trending-up-outline"
          [formControlRef]="experienceControl"
          [required]="true"
          formControlName="experience">
        </app-input-field>
      </div>

      <!-- Deadline -->
      <div class="form-group">
        <app-input-field
          label="Deadline"
          type="date"
          icon="calendar-outline"
          [formControlRef]="deadlineControl"
          [required]="true"
          formControlName="deadline">
        </app-input-field>
      </div>

      <!-- Submit -->
      <div class="form-actions">
        <app-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading">
          Post Job
        </app-button>
      </div>

    </form>

  </div>
</ion-content>
