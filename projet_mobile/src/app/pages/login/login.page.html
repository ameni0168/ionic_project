<ion-header mode="ios">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-page">
  <div class="login-container safe-area-bottom" *ngIf="showContent">
    
    <!-- Header -->
    <div class="login-header" @fadeInUp>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Sign in to FreelanceHub</p>
     
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form" @fadeInUp>
      
      <div class="form-group">
        <app-input-field
          label="Email Address"
          type="email"
          placeholder="Enter your email"
          icon="mail-outline"
          [formControlRef]="emailControl"
          [required]="true"
          formControlName="email">
        </app-input-field>
      </div>

      <div class="form-group">
        <app-input-field
          label="Password"
          type="password"
          placeholder="Enter your password"
          icon="lock-closed-outline"
          [formControlRef]="passwordControl"
          [required]="true"
          formControlName="password">
        </app-input-field>
      </div>

      <div class="forgot-password">
        <a class="link" (click)="navigateToForgotPassword()">Forgot password?</a>
      </div>

      <div class="form-actions">
        <app-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading"
          [disabled]="loginForm.invalid && loginForm.touched">
          Sign In
        </app-button>
      </div>
    </form>

    <!-- Footer -->
    <div class="login-footer" @fadeInUp>
      <p class="footer-text">
        Don't have an account? 
        <a class="link" (click)="navigateToWelcome()">Create account</a>
      </p>
    </div>
  </div>
</ion-content>
